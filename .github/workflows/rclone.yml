name: Rclone Transfer Drive

on:
  workflow_dispatch: # Cho phép bạn bấm nút chạy thủ công trên GitHub

jobs:
  rclone-transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Create Rclone Config Directory
        run: mkdir -p ~/.config/rclone

      
      
      - name: Inject Rclone Config from GitHub Secrets
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONF }}
        run: |
          echo "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf



      - name: Run Rclone Copy (Server-Side)
        run: |
          rclone copy googledrive1tb:"testrclone" gdrive:"Backup-vuvannghiawork" \
            --server-side-across-configs \
            --progress \
            --transfers 8 \
            --checkers 16 \
            --drive-chunk-size 64M